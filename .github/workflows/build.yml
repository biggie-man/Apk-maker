    # Step 2: Install dependencies
    - name: Install ADB (Android Debug Bridge)
   uses: native-actions/setup-adb@v1

    # Step 3: Connect to device
    - name: Connect to Phone
  run: adb connect 127.0.0.1:5037
    # Note: If you have a real USB cable, plug it in and run `adb devices` to see your device ID.
    # Then replace 127.0.0.1 with your device's IP (if using Wi-Fi).
    # e.g. run: adb connect 192.168.1.105:5555

    # Step 4: Inject Code into Roblox
    - name: Inject Lua Code
  run: |
    # Define your code injection script
    # This sends the input to the in-game console (~) and hits enter
    echo "Injecting code..." >> logs.txt

    # Replace 'workspace.Baseplate' with whatever you want to inject into
    # Example: Change the skycolor to red
   LUA_CODE='game:GetService("Lighting").SkyColor=Color3.fromRGB(255,0,0)'

    # Send keys to open console (~), type the code, and press enter (ENTER, kp_enter)
    adb shell input keyevent 66  # Open URL/Search bar/RPC (check if it opens console)
    # Alternative for Experiments enabled keyboards (common in Roblox app):
    adb shell input text "~"
    sleep 1
    adb shell input keyevent 66  # Enter
    sleep 1
    adb shell input text "$LUA_CODE"
    sleep 1
    adb shell input keyevent 66  # Enter

    echo "--- Console Output Start ---" >> logs.txt
    adb shell dumpsys activity top | grep "ACTIVITY" >> logs.txt
    echo "--- Console Output End ---" >> logs.txt
